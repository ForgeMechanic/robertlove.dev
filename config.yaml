baseURL: 'https://RobertLove.dev/'
locale: en-us
title: Robert Love
author: Robert Love
paginate: 5
theme: PaperMod
enableRobotsTXT: true

taxonomies:
  category: categories
  series: series
  tag: tags

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  description: "Software architecture, compilers, systems engineering, developer tooling, and the process of building things that make other things possible."
  keywords: ["compilers", "programming languages", "systems programming", "developer tooling", "software architecture", "binary formats", "AI-assisted engineering"]
  author: "Robert Love"
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false

  mainSections:
    - posts

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowToc: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: true
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  hideFooter: true
  showtoc: false
  tocopen: false

  editPost:
    URL: "https://github.com/ForgeMechanic/rlove.github.io/blob/main/content/"
    Text: "Suggest Changes"
    appendFilePath: true

  socialIcons:
    - name: Github
      url: "https://github.com/ForgeMechanic"
    - name: email
      url: "https://mailhide.io/e/SPjGlpBK"
    - name: stackoverflow
      url: "https://stackoverflow.com/users/93161/robert-love"
    - name: linkedin
      url: "https://www.linkedin.com/in/robjlove/"

outputs:
  home:
    - HTML
    - RSS
    - JSON

menu:
  main:
    - identifier: writing
      name: Writing
      url: /posts/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30

# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai
